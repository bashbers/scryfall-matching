[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scryfall-matching-backend"
version = "0.1.0"
description = "FastAPI backend for Scryfall Matching"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "msgpack==1.2.1",
  "pydantic>=2.9,<3",
  "setuptools==83.0.0",
  "typing-extensions>=4.12,<5",
  "uvicorn[standard]>=0.30,<1",
]

[project.scripts]
scryfall-matching-export-openapi = "scryfall_matching.core.openapi:main"

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.14"
strict = true
warn_unused_configs = true
packages = ["scryfall_matching"]
