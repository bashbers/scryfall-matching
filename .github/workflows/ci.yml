name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --locked --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest
      - run: uv run scryfall-matching-export-openapi --output openapi.json
      - run: git diff --exit-code -- openapi.json
      - run: uv export --locked --no-dev --no-emit-project --format requirements-txt -o /tmp/requirements.txt
      - run: uvx --from pip-audit==2.10.0 pip-audit --strict -r /tmp/requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run generate:api
      - run: git diff --exit-code -- src/api/generated.ts
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: false
          load: true
          tags: scryfall-matching-backend:ci
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: false
          load: true
          tags: scryfall-matching-frontend:ci
      - name: Export images for Trivy
        run: |
          docker save scryfall-matching-backend:ci --output /tmp/scryfall-backend.tar
          docker save scryfall-matching-frontend:ci --output /tmp/scryfall-frontend.tar
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          input: /tmp/scryfall-backend.tar
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          input: /tmp/scryfall-frontend.tar
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
